name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack yarn@4.18.0 install --immutable
      - run: corepack yarn@4.18.0 lint

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack yarn@4.18.0 install --immutable
      - run: corepack yarn@4.18.0 build
      - run: corepack yarn@4.18.0 coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lucy_control_panel
          path: coverage/cobertura-coverage.xml
          if-no-files-found: error

  upload-coverage:
    needs: build-test
    uses: Lucy-Robotics/.github/.github/workflows/codecov-upload.yaml@cma/fix-robot-package-ci-generalize
    with:
      artifact_name: coverage-lucy_control_panel
      flags: lucy_control_panel
      name: lucy_control_panel
    secrets: inherit
